<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تم الحجز · WYZ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@400;500;600;700&display=swap">
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1082484977738937');fbq('track','PageView');

<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;--soft:#FFF6E3;--gold:#F4B42A;--gold-2:#FFD465;--blue:#8A5D00;--blue-d:#151515;--ink:#24211C;--muted:#6B655A;--line:#EFE4CC;--sun:#F4B42A;--wa:#25D366;
  --f-head:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif;
  --f-body:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--soft),#fff 380px);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
a{color:inherit}
.top{max-width:640px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo b{font-family:var(--f-head);font-size:28px;color:var(--blue-d);line-height:1}
.logo span{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;direction:ltr;text-align:left}
.lang{border:2px solid var(--line);background:#fff;color:var(--blue-d);border-radius:999px;padding:6px 14px;font:700 14px var(--f-body);cursor:pointer}
main{max-width:640px;margin:0 auto;padding:24px 20px 56px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 20px 44px -28px rgba(21,21,21,.4);overflow:hidden;border-top:5px solid var(--gold)}
.head{padding:28px 24px 22px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto}
.ok i{width:44px;height:44px;border-radius:50%;background:var(--blue-d);display:grid;place-items:center}
.ok i::after{content:"";width:16px;height:8px;border-left:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(-45deg) translate(2px,-2px)}
h1{font-family:var(--f-head);color:var(--blue-d);font-size:clamp(28px,6vw,36px);line-height:1.25;margin:14px 0 0;text-wrap:balance}
.head p{color:var(--muted);margin:8px auto 0;max-width:46ch}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 20px}
.meta div{background:var(--soft);border-radius:14px;padding:10px 12px;text-align:center;min-width:0}
.meta span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.meta b{display:block;font-size:16px;color:var(--blue-d)}
.meta .id b{font-size:18px;color:var(--blue-d);direction:ltr;unicode-bidi:isolate;user-select:all;letter-spacing:.03em}
@media (max-width:480px){.meta{grid-template-columns:1fr 1fr}.meta .id{grid-column:1/-1}}
ol{list-style:none;margin:0;padding:6px 20px 8px;border-top:1px solid var(--line)}
ol li{display:flex;gap:14px;padding:14px 0}
ol li+li{border-top:1px dashed var(--line)}
ol .n{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--blue-d);color:var(--gold);display:grid;place-items:center;font:800 16px var(--f-head)}
ol b{display:block;color:var(--blue-d)}
ol small{display:block;color:var(--muted);font-size:15px}
.num{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.num code{font:700 22px var(--f-body);letter-spacing:.04em;color:var(--blue-d);direction:ltr;user-select:all}
.copy{border:2px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:3px 14px;font:700 13px var(--f-body);cursor:pointer}
.wallets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.wallets span{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--blue-d)}
.act{padding:18px 20px 24px;background:var(--soft);display:flex;flex-direction:column;gap:10px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 22px;border-radius:999px;font:700 18px var(--f-body);text-decoration:none}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 10px 22px -10px rgba(37,211,102,.7)}
.btn svg{width:26px;height:26px;fill:currentColor}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--blue-d);outline-offset:3px}
.act small{color:var(--muted);font-size:14px}
.back{display:block;text-align:center;margin-top:20px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/"><b>WYZ</b><span>Mechanics<br>Academy</span></a>
  <button class="lang" id="langBtn" type="button">English</button>
</div>
<main>
  <div class="card">
    <div class="head">
      <div class="ok"><i></i></div>
      <h1 data-i="h1"></h1>
      <p data-i="lede"></p>
    </div>
    <div class="meta">
      <div class="id"><span data-i="m_id"></span><b id="bId">—</b></div>
      <div><span data-i="m_pkg"></span><b id="bPkg">—</b></div>
      <div><span data-i="m_amt"></span><b id="bAmt">—</b></div>
    </div>
    <ol>
      <li><span class="n">1</span><div><b data-i="s1"></b><small data-i="s1p"></small>
        <div class="num"><code id="payNum">01099926718</code><button class="copy" type="button" id="copyBtn" data-i="copy"></button></div>
        <div class="wallets"><span>InstaPay</span><span>Vodafone Cash</span></div></div></li>
      <li><span class="n">2</span><div><b data-i="s2"></b><small data-i="s2p"></small></div></li>
      <li><span class="n">3</span><div><b data-i="s3"></b><small data-i="s3p"></small></div></li>
    </ol>
    <div class="act">
      <a class="btn btn-wa" id="waBtn" href="https://wa.me/201069635371" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
        <span data-i="wa"></span>
      </a>
      <small data-i="wa_note"></small>
    </div>
  </div>
  <a class="back" href="/" data-i="back"></a>
</main>
<script>
const WA='201069635371', PAY_NUM='01099926718';
const PK={1:{en:'Basic',ar:'الأساسية',price:1500},2:{en:'Practice',ar:'التمرين',price:2000},3:{en:'Full',ar:'الكاملة',price:3000}};
const T={
ar:{h1:'تمام، حجزك اتسجّل',lede:'فاضل خطوة واحدة: حوّل سعر الباقة وابعتلنا صورة التحويل على الواتساب.',
 m_id:'رقم الحجز',m_pkg:'الباقة',m_amt:'المبلغ',egp:'جنيه',pkg:'باقة',
 s1:'حوّل المبلغ',s1p:'بانستاباي أو فودافون كاش على الرقم ده:',
 s2:'خد سكرين شوت للتحويل',s2p:'اتأكد إن المبلغ ورقم العملية باينين.',
 s3:'ابعتها على واتساب الأكاديمية',s3p:'دوس على الزرار الأخضر تحت. الرسالة جاهزة برقم الحجز، ضيف الصورة بس.',
 wa:'ابعت صورة التحويل واتساب',wa_note:'رقم الأكاديمية: 01069635371 · مكانك بيتأكد أول ما نستلم الصورة.',copy:'نسخ',copied:'اتنسخ ✓',back:'ارجع لصفحة الكورس',
 msg:b=>`أهلاً WYZ Academy، حجزت كورس SOLIDWORKS CSWA.\nرقم الحجز: ${b.id}\nالاسم: ${b.name}\nالباقة: ${PK[b.pkg].ar} (${PK[b.pkg].price} جنيه)\nمرفق صورة التحويل.`},
en:{h1:'Done, your booking is registered',lede:'One step left: transfer the package price and send us the screenshot on WhatsApp.',
 m_id:'Booking number',m_pkg:'Package',m_amt:'Amount',egp:'EGP',pkg:'Package',
 s1:'Transfer the amount',s1p:'Via InstaPay or Vodafone Cash to:',
 s2:'Take a screenshot of the transfer',s2p:'Make sure the amount and reference are visible.',
 s3:'Send it to the academy WhatsApp',s3p:'Tap the green button. The message with your booking number is ready, just add the screenshot.',
 wa:'Send screenshot on WhatsApp',wa_note:'Academy number: 01069635371 · Your seat is confirmed once we get the screenshot.',copy:'Copy',copied:'Copied ✓',back:'Back to the course page',
 msg:b=>`Hi WYZ Academy, I booked the SOLIDWORKS CSWA course.\nBooking number: ${b.id}\nName: ${b.name}\nPackage: ${PK[b.pkg].en} (${PK[b.pkg].price} EGP)\nTransfer screenshot attached.`}
};
let b=null;
try{b=JSON.parse(sessionStorage.getItem('wyz_booking')||'null')}catch(_){}
const q=new URLSearchParams(location.search);
if(!b&&q.get('id'))b={id:q.get('id'),name:q.get('n')||'',pkg:+q.get('p')||2,lang:q.get('l')||'ar'};
if(!b)b={id:'WYZ-0000',name:'',pkg:2,lang:'ar'};
if(!PK[b.pkg])b.pkg=2;
let lang=b.lang||'ar';
function apply(l){
  lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[l][el.dataset.i];if(typeof v==='string')el.textContent=v});
  document.getElementById('langBtn').textContent=l==='ar'?'English':'عربي';
  document.getElementById('bId').textContent=b.id;
  document.getElementById('bPkg').textContent=T[l].pkg+' '+b.pkg+': '+PK[b.pkg][l];
  document.getElementById('bAmt').textContent=PK[b.pkg].price.toLocaleString('en-US')+' '+T[l].egp;
  document.getElementById('waBtn').href=`https://wa.me/${WA}?text=${encodeURIComponent(T[l].msg(b))}`;
  try{localStorage.setItem('wyz_lang',l)}catch(_){}
}
document.getElementById('langBtn').onclick=()=>apply(lang==='ar'?'en':'ar');
document.getElementById('waBtn').addEventListener('click',()=>{try{
  fbq('track','Contact',{content_name:'Package '+b.pkg,value:PK[b.pkg].price,currency:'EGP',button:'thank_you'});
  fbq('trackCustom','WhatsAppClick',{button:'thank_you',page:'thank_you',booking_id:b.id,value:PK[b.pkg].price,currency:'EGP'});
}catch(_){}});
const cb=document.getElementById('copyBtn');
cb.onclick=()=>{const done=()=>{cb.textContent=T[lang].copied;setTimeout(()=>cb.textContent=T[lang].copy,1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('payNum'));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(PAY_NUM).then(done,()=>{sel();done()})}catch(_){sel();done()}};
apply(lang);
</script>
</body>
</html>
